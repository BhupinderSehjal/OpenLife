name: Greetings

on:
  pull_request_target:
  issues:

jobs:
  greeting:
    runs-on: ubuntu-latest

    permissions:
      issues: write
      pull-requests: write

    steps:
      - uses: actions/first-interaction@v3
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}

          issue_message: |
            👋 Hi there! Welcome to **OpenLife** 🎉

            Thank you for opening your first issue.
            OpenLife helps individuals understand, analyze, and improve their daily workflow and time usage through reflection and meaningful insights.

            📌 Please make sure your issue includes:
            - A clear problem or feature description
            - Why it matters or what it improves
            - (Optional) Screenshots, examples, or suggestions

            💡 For new ideas or feature proposals, you can also start a discussion.
            We’re excited to have you here — happy contributing! 🚀

          pr_message: |
            🎉 Welcome and thank you for your first Pull Request to **OpenLife**!

            We truly appreciate your contribution and effort.
            Please ensure:
            - Code is clean, readable, and well-structured
            - Commits are meaningful
            - The PR description clearly explains the change

            🌱 OpenLife is a beginner-friendly, learning-focused open-source project.
            Don’t hesitate to ask questions or request feedback.

            Thank you for building with us — welcome to the community! 💙
